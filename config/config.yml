rails:
  # L'entonnoir d'entrée
  input:
    flows:
      - check prompt length     # Action Python ultrarapide
      - mask pii input          # microsoft presidio
      - block jailbreak model attempt  #sinon jailbreak local
      - restrict input scope
      

  # L'entonnoir de sortie
  output:
    flows:
      - detect system prompt leakage  # Bloque les fuites du prompt systeme
      - check rag support        # Verifie que la reponse est supportee par le RAG
      - restrict scope           # Similarite semantique Ollama
      - output mask pii

